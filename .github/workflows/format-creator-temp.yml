name: Validate Creator Layer

on:
  push:
    branches:
      - feat/free-creator-routing-and-voices

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier src/components/studio/VoiceLabPanel.tsx src/routes/voice-lab.tsx src/routeTree.gen.ts --write
      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/components/studio/VoiceLabPanel.tsx src/routes/voice-lab.tsx src/routeTree.gen.ts; then
            echo "Already formatted"
          else
            git add src/components/studio/VoiceLabPanel.tsx src/routes/voice-lab.tsx src/routeTree.gen.ts
            git commit -m "style: format creator voice layer"
            git push
          fi
      - run: npx tsc --noEmit
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run build
