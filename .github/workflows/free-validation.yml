name: Free Open Validation

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Normalize formatting
        run: npx prettier --write src/components/studio/BuddyLiveChatLite.tsx src/components/studio/FreeCreatePanel.tsx src/lib/gradio-free.ts
      - name: Type-check
        run: npx tsc --noEmit
      - name: Auto-fix lint formatting
        run: npm run lint -- --fix
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
